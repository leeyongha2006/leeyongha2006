<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-label="유튜브 쇼츠 자동 제작">
<style>
    
    .in { animation: in .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .badge { font: 800 12px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; }
    .when { font: 700 13px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #93a4bd; }
    .title { font: 800 23px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #e8eef7; letter-spacing: -.5px; }
    .desc { font: 500 15px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #93a4bd; }
    .tag { font: 600 12.5px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; }
</style>
<g class="in" style="animation-delay:0s">
    <rect x=".5" y=".5" width="589" height="229" rx="20" fill="#0e1726" stroke="#1f2e45"/>
    <rect x="26" y="26" width="96" height="24" rx="8" fill="#3ba3ff" fill-opacity=".14"/>
    <text x="74" y="42" text-anchor="middle" class="badge" fill="#3ba3ff">Automation</text>
    <text x="564" y="43" text-anchor="end" class="when">2026.10 –</text>
    <text x="26" y="94" class="title">유튜브 쇼츠 자동 제작</text>
    <text x="26" y="130" class="desc">화제 주제를 모아 대본, 음성, 지도 영상을 만들고</text>
    <text x="26" y="154" class="desc">예약 업로드까지 3시간마다 스스로 돌아갑니다.</text>
    <g transform="translate(26 180)"><g transform="translate(0 0)"><rect x=".5" y=".5" width="71" height="27" rx="13.5" fill="#3ba3ff" fill-opacity=".14" stroke="#3ba3ff" stroke-opacity=".4"/><text x="36" y="19" text-anchor="middle" class="tag" fill="#3ba3ff">Python</text></g><g transform="translate(80 0)"><rect x=".5" y=".5" width="101" height="27" rx="13.5" fill="#070d18" fill-opacity="1" stroke="#1f2e45" stroke-opacity="1"/><text x="51" y="19" text-anchor="middle" class="tag" fill="#e8eef7">Gemini TTS</text></g><g transform="translate(190 0)"><rect x=".5" y=".5" width="71" height="27" rx="13.5" fill="#070d18" fill-opacity="1" stroke="#1f2e45" stroke-opacity="1"/><text x="36" y="19" text-anchor="middle" class="tag" fill="#e8eef7">ffmpeg</text></g></g>
</g>
</svg>
