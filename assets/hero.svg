<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Salesforce 개발자, 이용하입니다.">
<defs>
    <linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#3ba3ff"/><stop offset=".5" stop-color="#4cc9f0"/><stop offset="1" stop-color="#a594ff"/></linearGradient>
    <radialGradient id="glowA" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#4cc9f0" stop-opacity=".28"/><stop offset=".7" stop-color="#4cc9f0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0" cy="1" r=".7"><stop offset="0" stop-color="#a594ff" stop-opacity=".14"/><stop offset=".7" stop-color="#a594ff" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1200" height="400" rx="20"/></clipPath>
</defs>
<style>
    
    .in { animation: in .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .pill { font: 600 15px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #e8eef7; }
    .h1 { font: 800 64px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; letter-spacing: -2.5px; fill: #e8eef7; }
    .lead { font: 400 20px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #93a4bd; }
    .lead tspan.b { font-weight: 700; fill: #e8eef7; }
    .dot { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.6); opacity: .35; } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); } }
    .orb { font: 700 13px Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #e8eef7; }
</style>
<g clip-path="url(#clip)">
    <rect width="1200" height="400" fill="#070d18"/>
    <rect width="1200" height="400" fill="url(#glowA)"/>
    <rect width="1200" height="400" fill="url(#glowB)"/>
    <g transform="translate(820 60)">
        <g class="float">
            <path transform="translate(40 50) scale(5.2)" fill="#4cc9f0" d="M20.8 4.3c1.6-1.7 3.9-2.7 6.4-2.7 3.3 0 6.2 1.8 7.7 4.6 1.3-.6 2.8-.9 4.3-.9 6 0 10.8 4.8 10.8 10.8s-4.8 10.8-10.8 10.8c-.7 0-1.5-.1-2.2-.2-1.4 2.4-3.9 4-6.9 4-1.2 0-2.4-.3-3.4-.8-1.3 3.1-4.4 5.2-7.9 5.2-3.7 0-6.9-2.4-8.1-5.7-.5.1-1.1.2-1.7.2C2.7 29.6 0 25.7 0 21.9c0-2.6 1.4-4.9 3.4-6.2-.4-1-.7-2.1-.7-3.3C2.7 8 6.4 4.4 10.9 4.4c2.6 0 5 1.2 6.6 3.2"/>
        </g>
        <g class="float" style="animation-delay:-1.5s"><rect x="0" y="10" width="62" height="32" rx="16" fill="#0e1726" stroke="#1f2e45"/><text x="31" y="31" text-anchor="middle" class="orb">Apex</text></g>
        <g class="float" style="animation-delay:-3s"><rect x="250" y="110" width="58" height="32" rx="16" fill="#0e1726" stroke="#1f2e45"/><text x="279" y="131" text-anchor="middle" class="orb">LWC</text></g>
        <g class="float" style="animation-delay:-4.5s"><rect x="60" y="238" width="56" height="32" rx="16" fill="#0e1726" stroke="#1f2e45"/><text x="88" y="259" text-anchor="middle" class="orb">2GP</text></g>
    </g>
    <g transform="translate(64 0)">
        <g class="in">
            <rect x="0" y="52" width="332" height="36" rx="18" fill="#0e1726" stroke="#1f2e45"/>
            <circle cx="22" cy="70" r="9" fill="#22c55e" fill-opacity=".25" class="dot"/>
            <circle cx="22" cy="70" r="5" fill="#22c55e"/>
            <text x="38" y="75" class="pill">Salesforce Developer · Apex · LWC · AI</text>
        </g>
        <g class="in" style="animation-delay:.12s">
            <text x="0" y="168" class="h1"><tspan fill="url(#grad)">Salesforce</tspan> 개발자,</text>
            <text x="0" y="246" class="h1">이용하입니다.</text>
        </g>
        <g class="in" style="animation-delay:.28s">
            <text x="0" y="306" class="lead">Salesforce 위에서 <tspan class="b">2GP 패키지 설계</tspan>, <tspan class="b">AI 에이전트와 MCP 서버</tspan>, <tspan class="b">업무 화면(LWC)</tspan>까지</text>
            <text x="0" y="338" class="lead">하나의 솔루션을 제품으로 만들어 고객에게 설치되는 데까지 책임집니다.</text>
        </g>
    </g>
</g>
</svg>
