<g transform="translate(0 0)"><rect width="416" height="116" rx="14" fill="#161b22"/><text x="24" y="40" class="t">패키지 설계</text><rect x="347" y="20" width="49" height="24" rx="12" fill="#0c2d48"/><text x="371.5" y="36" text-anchor="middle" class="g">CMDT</text><rect x="299" y="20" width="42" height="24" rx="12" fill="#0c2d48"/><text x="320.0" y="36" text-anchor="middle" class="g">2GP</text><text x="24" y="74" class="d">하나로 묶인 솔루션을 2GP 패키지 16개로 나눠</text><text x="24" y="96" class="d">필요한 모듈만 골라 설치할 수 있게 설계</text></g>
